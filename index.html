<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Previsão do tempo simples e direta, com dados em tempo real da Open-Meteo.">
  <meta name="theme-color" content="#F6F5F1">
  <title>Clima — Previsão do Tempo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-weather="default">
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1 class="brand-name">Clima</h1>
      </div>

      <form id="search-form" class="search-form" role="search" aria-label="Buscar cidade" novalidate>
        <label for="city-input" class="sr-only">Nome da cidade</label>
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7.5"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input
            type="search"
            id="city-input"
            name="city"
            placeholder="Buscar cidade..."
            autocomplete="off"
            spellcheck="false"
            required
          >
          <button type="submit" id="search-btn" class="search-submit" aria-label="Buscar previsão">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </button>
        </div>
      </form>
    </header>

    <main class="app-main">
      <section id="feedback-region" class="feedback-region" aria-label="Status">
        <div id="status-message" role="status" aria-live="polite" class="status-panel empty-state">
          <p class="status-title">Consulte o tempo em qualquer cidade</p>
          <p class="status-desc">Digite o nome acima ou escolha um destino para começar.</p>
          <div class="quick-cities" aria-label="Sugestões de cidades">
            <button type="button" class="city-chip" data-city="São Paulo">São Paulo</button>
            <button type="button" class="city-chip" data-city="Lisboa">Lisboa</button>
            <button type="button" class="city-chip" data-city="Tóquio">Tóquio</button>
          </div>
        </div>
      </section>

      <section id="weather-section" class="weather-section hidden" aria-label="Previsão do tempo">
        <article class="current-card">
          <div class="current-top">
            <div class="location-group">
              <h2 id="current-city" class="city-name">—</h2>
              <p id="current-date" class="current-date">—</p>
            </div>
            <div id="current-icon" class="current-icon" role="img" aria-label="Condição do tempo"></div>
          </div>

          <div class="current-main">
            <div class="temp-display">
              <span id="current-temp" class="temp-value">--</span><span class="temp-degree">°</span>
            </div>
            <p id="current-condition" class="condition-text">—</p>
          </div>

          <dl class="current-metrics" aria-label="Detalhes atuais">
            <div class="metric">
              <dt class="metric-label">
                <svg class="metric-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
                Umidade
              </dt>
              <dd id="current-humidity" class="metric-value">--%</dd>
            </div>
            <div class="metric">
              <dt class="metric-label">
                <svg class="metric-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.7 7.7A2.5 2.5 0 1 1 19 12H2"></path>
                  <path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path>
                  <path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path>
                </svg>
                Vento
              </dt>
              <dd id="current-wind" class="metric-value">-- km/h</dd>
            </div>
          </dl>
        </article>

        <section class="forecast-section" aria-label="Próximos 5 dias">
          <h3 class="section-label">Próximos 5 dias</h3>
          <div id="forecast-grid" class="forecast-list"></div>
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <p>
        Dados por
        <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
        ·
        <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
      </p>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
